[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "backlink-gap-finder"
version = "1.0.0"
description = "Domains linking to competitors but not to you, ranked by how many competitors they link to"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Meer Hamza", email = "meerhamza5@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11", "pandas>=1.5", "openpyxl>=3.1", "click>=8.1"]
keywords = ["seo", "backlink", "gap", "finder"]

[project.urls]
Homepage = "https://github.com/marketing-MEER/backlink-gap-finder"
"SEO Toolbox" = "https://github.com/marketing-MEER/seo-toolbox"
LinkedIn = "https://www.linkedin.com/in/meerhamza-seo"

[project.scripts]
backlink-gap-finder = "backlink_gap_finder.cli:main"

[tool.setuptools]
packages = ["backlink_gap_finder"]
